name: docker-build-and-push

on:
  push:
    branches:
      - main
      - linuxarm64

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push (arm64 only)
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/Containerfile
          push: true
          platforms: linux/arm64  
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kestrel:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/kestrel:${{ github.sha }}

  colcon-build:
    needs: docker-build-and-push 
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Pull latest ARM64 image
        run: docker pull --platform=linux/arm64 ${{ secrets.DOCKERHUB_USERNAME }}/kestrel:latest
      
      - name: Colcon build stage
        run: |
          docker run --rm \
            --platform=linux/arm64 \ 
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${{ secrets.DOCKERHUB_USERNAME }}/kestrel:latest \
            bash -c "cd src && colcon build"
